server:
  port: 8443
  ssl:
    enabled: true
    key-store: file:./keystore.p12
    key-store-password: ${KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: career
  error:
    include-message: always
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/career
    username: ${DB_USER:career}
    password: ${DB_PASSWORD:career}
  jpa:
    hibernate:
      ddl-auto: update
